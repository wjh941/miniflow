name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: 构建校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json 已提交，用 npm ci 保证安装可复现
      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
